<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Pixelify+Sans:wght@500;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ '/' | relative_url }}"><i aria-hidden="true"></i>{{ site.title }}</a>
    <nav aria-label="Main">
      {% for n in site.nav %}<a href="{{ n.url | relative_url }}">{{ n.label }}</a>{% endfor %}
      {% for l in site.links %}<a href="{{ l.url }}">{{ l.label }}</a>{% endfor %}
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="foot">
    <span>&copy; {{ 'now' | date: "%Y" }} {{ site.author }}</span>
    <span>{% for l in site.links %}<a href="{{ l.url }}">{{ l.label }}</a>{% unless forloop.last %} &middot; {% endunless %}{% endfor %}</span>
  </footer>
</body>
</html>
